name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Grant camera & microphone permissions (needed for chat/video calls)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Use a fixed debug signing key (so Google Sign-In's SHA-1 never changes between builds)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore
          python3 patch_gradle_signing.py android/app/build.gradle
          cat android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Print the SHA-1 actually baked into this APK (for Google Sign-In debugging)
        run: |
          echo "===== SHA-1 that SHOULD be registered in Firebase / Google Cloud ====="
          echo "52:CE:16:70:01:27:B3:55:29:73:2B:56:09:B1:B8:93:87:EB:5B:4C"
          echo ""
          echo "===== Full cert info actually used to sign this build's APK ====="
          APKSIGNER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android -iname apksigner 2>/dev/null | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "apksigner not found, falling back to keytool"
            keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk
          fi
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinnar-talk-user-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
